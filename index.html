<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070910">
<meta name="description" content="Starbase 2042. Launch a cartoon rocket from South Texas and fly for the Moon.">
<title>Starbase 2042</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070910' width='32' height='32'/%3E%3Cpath fill='%23f4efe4' d='M16 3l3.2 8h-2.2v9h-2V11h-2.2z'/%3E%3Cpath fill='%23d24a3a' d='M11 22h10l-1.6 4h-6.8z'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --ink: #f4efe4;
    --muted: #b7c0c4;
    --line: rgba(244, 239, 228, 0.18);
    --sand: #e7d7b4;
    --flame: #ffb15a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070910; color: var(--ink); }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  button, input { font: inherit; color: inherit; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(14px + env(safe-area-inset-top)) 18px 0 calc(16px + env(safe-area-inset-left));
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }
  #brand { letter-spacing: 0.16em; text-transform: uppercase; font-size: 12px; color: var(--sand); }
  #goal { margin: 6px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
  #headed { margin: 0; font-size: 18px; }
  #place, #cue { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  #place:empty { display: none; }
  #cue { color: var(--flame); }
  #pips { display: flex; gap: 8px; margin-top: 8px; }
  #pips span {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  #pips span.on { color: #07110c; background: #d7f5c8; border-color: #d7f5c8; }
  #mute {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    right: calc(12px + env(safe-area-inset-right));
    min-width: 48px;
    min-height: 48px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(8, 12, 18, 0.55);
  }
  #dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(5, 8, 14, 0.78) 28%);
  }
  .slider { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
  .slider span { color: var(--sand); font-weight: 650; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 48px;
    background: transparent;
    margin: 0;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 14px; border-radius: 8px; background: rgba(244, 239, 228, 0.18);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 44px; height: 44px; margin-top: -15px;
    border-radius: 50%; background: var(--ink); border: 0;
  }
  input[type="range"]::-moz-range-track {
    height: 14px; border-radius: 8px; background: rgba(244, 239, 228, 0.18);
  }
  input[type="range"]::-moz-range-thumb {
    width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--ink);
  }
  #fuel { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  #fuel i {
    flex: 1; height: 8px; border-radius: 8px; background: rgba(244, 239, 228, 0.16);
    position: relative; overflow: hidden;
  }
  #fuelBar {
    position: absolute; inset: 0; background: var(--flame); transform-origin: left center;
  }
  #actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    min-height: 52px;
    min-width: 64px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(16, 22, 32, 0.82);
    font-size: 17px;
  }
  button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
  #fire, #again {
    flex: 1;
    background: var(--ink);
    color: #1a120c;
    border-color: var(--ink);
    font-weight: 750;
    font-size: 20px;
  }
  #flight { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  #flight[hidden], [hidden] { display: none !important; }
  #flight button.on { background: var(--sand); color: #1a120c; border-color: var(--sand); }
  #warpNow { align-self: center; min-width: 64px; color: var(--sand); font-variant-numeric: tabular-nums; }
  @media (orientation: landscape) {
    #goal { font-size: 22px; }
    #dock { flex-direction: row; align-items: flex-end; flex-wrap: wrap; }
    .slider { flex: 1; min-width: 180px; }
    #fuel { flex-basis: 100%; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="brand">Starbase 2042</div>
  <p id="goal">The Moon</p>
  <p id="headed">South Texas</p>
  <p id="place">South Texas</p>
  <p id="cue">Set the burn, then fire</p>
  <div id="pips">
    <span data-k="earthOrbit">Orbit</span>
    <span data-k="moon">Moon</span>
    <span data-k="marsOrbit">Mars</span>
  </div>
</div>
<button id="mute" type="button">Sound</button>
<div id="dock">
  <label class="slider">Burn <span id="burnWord">Hard</span>
    <input id="burn" type="range" min="0" max="100" value="80" aria-label="How hard to burn">
  </label>
  <label class="slider">Aim <span id="aimWord">Up</span>
    <input id="aim" type="range" min="-180" max="180" value="0" aria-label="Which way to aim">
  </label>
  <div id="fuel"><span>Fuel</span><i><b id="fuelBar"></b></i></div>
  <div id="actions">
    <button id="fire" type="button">Fire</button>
    <div id="flight" hidden>
      <button type="button" data-warp="1">1×</button>
      <button type="button" data-warp="25">25×</button>
      <button type="button" data-warp="100">100×</button>
      <button type="button" data-warp="1000">1000×</button>
      <button type="button" data-warp="8000">8000×</button>
      <span id="warpNow">1×</span>
      <button id="peri" type="button">To periapsis</button>
      <button id="apo" type="button">To apoapsis</button>
    </div>
    <button id="again" type="button" hidden>Fly again</button>
  </div>
</div>
<script src="js/flight.js"></script>
<script src="js/guidance.js"></script>
<script src="js/map.js"></script>
<script src="js/save.js"></script>
<script src="js/controls.js"></script>
<script src="js/hud.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
